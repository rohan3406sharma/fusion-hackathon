<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>s02 canal</title></head>
  <body>
    <template id="s02-canal-template">
      <style>
        #s02-canal { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
        #s02-canal .stage { position: absolute; inset: 0; }
        #s02-canal .nothypo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 132px; }
        #s02-canal .case { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #s02-canal .year { position: absolute; left: 120px; top: 132px; font-family: var(--serif); font-size: 196px; line-height: 0.9; color: var(--text); }
        #s02-canal .place { position: absolute; left: 128px; top: 382px; width: 1000px; }
        #s02-canal .place .fx-headline { font-size: 64px; margin-top: 12px; }
        #s02-canal .canal { position: absolute; left: 120px; top: 600px; width: 720px; height: 251px; }
        #s02-canal .canal .lbl { position: absolute; font-family: var(--label); font-size: 21px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); }
        #s02-canal .gauge { position: absolute; left: 880px; top: 600px; width: 60px; height: 230px; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
        #s02-canal .gauge .lvl { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: linear-gradient(to top, #24557d, #3a7db0); transform-origin: 50% 100%; }
        #s02-canal .gauge .lvl i { position: absolute; inset: 0; background: linear-gradient(to top, #8e2b21, #e0553b); opacity: 0; }
        #s02-canal .gauge-l { position: absolute; left: 964px; top: 600px; width: 230px; font-family: var(--body); font-size: 22px; color: var(--text-dim); line-height: 1.38; }
        #s02-canal .gauge-l b { display: block; font-family: var(--label); font-size: 19px; letter-spacing: 0.16em; text-transform: uppercase; color: #f08a72; margin-bottom: 6px; }
        #s02-canal .chart { position: absolute; left: 1290px; top: 170px; width: 520px; height: 380px; }
        #s02-canal .chart .ttl { font-family: var(--label); font-size: 21px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); }
        #s02-canal .bars { position: absolute; left: 0; right: 0; bottom: 36px; height: 260px; display: flex; align-items: flex-end; gap: 22px; }
        #s02-canal .bar { position: relative; flex: 1; background: var(--text-dim); border-radius: 6px 6px 0 0; transform-origin: 50% 100%; }
        #s02-canal .bar.last { background: var(--hazard); }
        #s02-canal .bar i { position: absolute; left: 0; right: 0; top: -40px; text-align: center; font-style: normal; font-family: var(--mono); font-size: 28px; color: var(--text); }
        #s02-canal .bar u { position: absolute; left: -10px; right: -10px; bottom: -34px; text-align: center; text-decoration: none; font-family: var(--body); font-size: 17px; color: var(--muted); }
        #s02-canal .big18 { position: absolute; left: 1290px; top: 620px; font-family: var(--serif); font-size: 150px; line-height: 1; color: var(--hazard); }
        #s02-canal .big18 span { display: block; font-family: var(--label); font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); margin-top: 8px; }
        #s02-canal .chain { position: absolute; inset: 0; }
        #s02-canal .chain svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #s02-canal .chain .t1, #s02-canal .chain .t2 { position: absolute; left: 0; right: 0; text-align: center; }
        #s02-canal .chain .t1 { top: 170px; font-size: 84px; }
        #s02-canal .chain .t2 { top: 820px; font-size: 84px; }
      </style>
      <div id="s02-canal" data-composition-id="s02-canal" data-width="1920" data-height="1080">
        <div class="stage">
          <div class="nothypo"><h1 class="fx-headline">It's not <em>hypothetical.</em></h1></div>
          <div class="case">
            <div class="year">2023</div>
            <div class="place"><div class="fx-eyebrow">Panama Canal · drought</div><h2 class="fx-headline">The lake that feeds the canal ran <span class="hz">record-low</span> for the season</h2></div>
            <svg class="canal" viewBox="0 0 860 300"></svg>
            <div class="gauge"><div class="lvl"><i></i></div></div>
            <div class="gauge-l"><b>Gatún Lake level</b>“Unprecedented levels for this time of year.” October rainfall: lowest since 1950 (41% below).</div>
            <div class="chart"><div class="ttl">Daily booking slots, Panama Canal</div><div class="bars"></div></div>
            <div class="big18">18<span>ships a day from 1 Feb 2024</span></div>
          </div>
          <div class="chain"><svg viewBox="0 0 1920 1080"></svg>
            <h2 class="fx-headline t1">The hazard wasn't at anyone's <em>factory.</em></h2>
            <h2 class="fx-headline t2">It was in a <span class="hz">shared link</span> of the chain.</h2>
          </div>
          <div class="fx-source">Source: <b>Panama Canal Authority, Advisory to Shipping No. A-48-2023</b> (30 Oct 2023): booking slots reduced to 25, 24, 22, 20, then 18 per day; October 2023 rainfall the lowest since 1950.</div>
        </div>
      </div>
      <script>
        (function () {
          const ID = 's02-canal', FX = window.FX
          const root = document.getElementById(ID), stage = root.querySelector('.stage'), L = FX.clock(ID)
          const tl = gsap.timeline({ paused: true })
          FX.envelope(tl, stage, ID)
          stage.insertBefore(FX.chapter(null, '02', 'The problem'), stage.firstChild)
          const chap = stage.querySelector('.fx-chapter')
          tl.fromTo(chap, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.5)

          // "It's not hypothetical."
          const nh = root.querySelector('.nothypo h1')
          const l05 = FX.line('L05')
          tl.fromTo(nh, { opacity: 0, y: 30, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'power3.out' }, L(l05.start) - 0.15)
          tl.to(nh, { opacity: 0, y: -30, duration: 0.35, ease: 'power2.in' }, L(FX.line('L06').start) - 0.25)

          // the case: 2023, Panama Canal
          const t06 = L(FX.line('L06').start)
          tl.fromTo(root.querySelector('.year'), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, t06 + 0.05)
          tl.fromTo(root.querySelector('.place'), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.7, ease: 'power3.out' }, L(FX.word('L06', 'drought')) - 0.1)
          tl.fromTo(root.querySelector('.place .hz'), { color: '#ece6da' }, { color: '#e0553b', duration: 0.4 }, L(FX.word('L06', 'record')))

          // schematic: Atlantic — locks — Gatún Lake — locks — Pacific
          const cs = root.querySelector('svg.canal')
          const sea = (x, label) => { const g = FX.svg('g', {}, cs); FX.svg('rect', { x, y: 150, width: 150, height: 90, rx: 10, fill: '#1d3a57' }, g); const t = FX.svg('text', { x: x + 75, y: 275, 'text-anchor': 'middle', fill: '#9aa3b1', 'font-family': 'Space Grotesk', 'font-size': 20, 'letter-spacing': 3 }, g); t.textContent = label; return g }
          const atl = sea(0, 'ATLANTIC'), pac = sea(710, 'PACIFIC')
          const lockL = FX.svg('g', {}, cs), lockR = FX.svg('g', {}, cs)
          ;[0, 1, 2].forEach((k) => { FX.svg('rect', { x: 165 + k * 32, y: 150 - k * 26, width: 28, height: 90 + k * 26, fill: '#2a4a6b' }, lockL); FX.svg('rect', { x: 667 - k * 32, y: 150 - k * 26, width: 28, height: 90 + k * 26, fill: '#2a4a6b' }, lockR) })
          const lake = FX.svg('rect', { x: 262, y: 98, width: 336, height: 142, rx: 18, fill: '#2f6a99' }, cs)
          const lakeT = FX.svg('text', { x: 430, y: 275, 'text-anchor': 'middle', fill: '#ece6da', 'font-family': 'Space Grotesk', 'font-size': 20, 'letter-spacing': 3 }, cs); lakeT.textContent = 'GATÚN LAKE (FEEDS THE LOCKS)'
          const ship = FX.svg('path', { d: 'M0 0 L46 0 L38 12 L6 12 Z', fill: '#ece6da' }, cs)
          tl.fromTo([atl, pac, lockL, lockR, lake, lakeT], { opacity: 0 }, { opacity: 1, duration: 0.6, stagger: 0.08 }, L(FX.word('L06', 'panama')) - 0.4)
          tl.fromTo(ship, { x: 40, y: 136, opacity: 0 }, { x: 400, y: 84, opacity: 1, duration: 3.6, ease: 'sine.inOut' }, L(FX.word('L06', 'panama')))
          // the lake drops
          const tLow = L(FX.word('L06', 'record'))
          tl.to(lake, { attr: { y: 150, height: 90 }, fill: '#244e72', duration: 1.6, ease: 'power2.inOut' }, tLow - 0.4)
          tl.to(ship, { y: 136, duration: 1.6, ease: 'power2.inOut' }, tLow - 0.4)
          const gauge = root.querySelector('.gauge'), gl = root.querySelector('.gauge-l'), lvl = root.querySelector('.gauge .lvl')
          tl.fromTo([gauge, gl], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.1 }, tLow - 1.2)
          tl.fromTo(lvl, { scaleY: 0.9 }, { scaleY: 0.38, duration: 1.8, ease: 'power2.inOut' }, tLow - 0.4)
          tl.fromTo(lvl.querySelector('i'), { opacity: 0 }, { opacity: 1, duration: 1.2 }, tLow + 0.2)

          // booking slots step down: 25 → 24 → 22 → 20 → 18
          const bars = root.querySelector('.bars'), data = [['25', 'Nov 3'], ['24', 'Nov 7'], ['22', 'Dec'], ['20', 'Jan'], ['18', 'Feb 1']]
          const chart = root.querySelector('.chart')
          tl.fromTo(chart, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, L(FX.line('L07').start) - 0.2)
          const tStep = L(FX.cue('canal_step'))
          data.forEach(([v, d], k) => {
            const b = FX.h('div', { class: 'bar' + (k === 4 ? ' last' : ''), style: { height: (Number(v) / 25 * 100).toFixed(1) + '%' } }, bars, `<i>${v}</i><u>${d}</u>`)
            tl.fromTo(b, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.3, ease: 'power3.out' }, tStep + k * 0.34)
          })
          const big = root.querySelector('.big18')
          tl.fromTo(big, { opacity: 0, scale: 0.8, transformOrigin: '0% 50%' }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, L(FX.word('L07', '18')) - 0.1)
          tl.fromTo(root.querySelector('.fx-source'), { opacity: 0 }, { opacity: 1, duration: 0.6 }, L(FX.line('L07').start))

          // the shared link: factories fine, the link fails
          const t08 = L(FX.line('L08').start)
          const caseEl = root.querySelector('.case')
          tl.to(caseEl, { opacity: 0, y: -20, duration: 0.45, ease: 'power2.in' }, t08 - 0.45)
          tl.to(root.querySelector('.fx-source'), { opacity: 0, duration: 0.4 }, t08 - 0.45)
          const csvg = root.querySelector('.chain svg')
          const hub = { x: 960, y: 520 }
          const left = [0, 1, 2, 3].map((k) => ({ x: 330, y: 330 + k * 128 })), right = [0, 1, 2, 3].map((k) => ({ x: 1590, y: 330 + k * 128 }))
          const links = [], facs = []
          ;[...left, ...right].forEach((p) => {
            const c = FX.curve(p, hub, p.x < hub.x ? 0.08 : -0.08)
            const path = FX.svg('path', { d: c.d, fill: 'none', stroke: '#8b97a8', 'stroke-width': 3, 'stroke-dasharray': c.len.toFixed(1), 'stroke-dashoffset': c.len.toFixed(1) }, csvg)
            links.push(path)
          })
          const factory = (p) => {
            const outer = FX.svg('g', { transform: `translate(${p.x - 34} ${p.y - 30})` }, csvg), g = FX.svg('g', {}, outer)
            FX.svg('path', { d: 'M0 60 L0 22 L18 32 L18 22 L36 32 L36 8 L50 8 L50 32 L68 32 L68 60 Z', fill: '#ece6da' }, g)
            const ok = FX.svg('circle', { cx: 74, cy: 6, r: 13, fill: '#62b88d' }, g)
            const tick = FX.svg('path', { d: 'M68 6 L72.5 10.5 L80 2', fill: 'none', stroke: '#0c1016', 'stroke-width': 3, 'stroke-linecap': 'round' }, g)
            facs.push(g); return g
          }
          ;[...left, ...right].forEach(factory)
          const hubG = FX.svg('g', {}, csvg)
          const hubC = FX.svg('circle', { cx: hub.x, cy: hub.y, r: 46, fill: '#131922', stroke: '#8b97a8', 'stroke-width': 3 }, hubG)
          const hubT = FX.svg('text', { x: hub.x, y: hub.y + 86, 'text-anchor': 'middle', fill: '#9aa3b1', 'font-family': 'Space Grotesk', 'font-size': 22, 'letter-spacing': 4 }, hubG); hubT.textContent = 'SHARED LINK'
          const hubI = FX.svg('path', { d: `M${hub.x - 22} ${hub.y + 8} L${hub.x + 22} ${hub.y + 8} L${hub.x + 16} ${hub.y + 18} L${hub.x - 16} ${hub.y + 18} Z M${hub.x - 4} ${hub.y + 8} L${hub.x - 4} ${hub.y - 18} L${hub.x + 14} ${hub.y + 2} L${hub.x - 4} ${hub.y + 2}`, fill: '#ece6da' }, hubG)
          tl.fromTo(facs, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.05, ease: 'power3.out' }, t08 - 0.1)
          tl.to(links, { strokeDashoffset: 0, duration: 0.7, stagger: 0.04, ease: 'power2.out' }, t08 + 0.1)
          tl.fromTo(hubG, { opacity: 0, scale: 0.6, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2)' }, t08 + 0.35)
          const t1 = root.querySelector('.chain .t1'), t2 = root.querySelector('.chain .t2')
          tl.fromTo(t1, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t08 - 0.05)
          const tLink = L(FX.word('L08', 'shared')) - 0.2
          tl.fromTo(t2, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, L(FX.word('L08', 'it', 0)) - 0.1)
          tl.to(hubC, { attr: { stroke: '#e0553b', fill: '#3a1712' }, duration: 0.3 }, tLink)
          tl.to(hubT, { attr: { fill: '#f08a72' }, duration: 0.3 }, tLink)
          tl.to(links, { attr: { stroke: '#e0553b' }, strokeDasharray: '10 12', duration: 0.4, stagger: 0.02 }, tLink + 0.1)
          FX.burst(tl, hubC, tLink, { scale: 1.25, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.6, ease: 'elastic.out(1, 0.5)' })

          window.__timelines[ID] = tl
        })()
      </script>
    </template>
  </body>
</html>
