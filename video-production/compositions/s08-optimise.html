<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>s08 optimise</title></head>
  <body>
    <template id="s08-optimise-template">
      <style>
        #s08-optimise { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
        #s08-optimise .stage { position: absolute; inset: 0; }
        #s08-optimise .vwrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #s08-optimise .vwrap video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border-radius: 0 0 14px 14px; }
        #s08-optimise .fx-callout.gd .v { color: var(--gold); }
        #s08-optimise .ba { margin-top: 14px; width: 560px; }
        #s08-optimise .ba .row { display: flex; align-items: center; gap: 14px; margin-top: 12px; font-family: var(--label); font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
        #s08-optimise .ba .row b { width: 90px; font-weight: 500; }
        #s08-optimise .ba .bar { flex: 1; height: 26px; border-radius: 6px; background: var(--ink-3); position: relative; overflow: hidden; }
        #s08-optimise .ba .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 6px; transform-origin: 0 50%; }
        #s08-optimise .ba .f1 { background: #8b97a8; }
        #s08-optimise .ba .f2 { background: var(--gold); }
        #s08-optimise .ba .row span { width: 96px; text-align: right; font-family: var(--mono); font-size: 24px; letter-spacing: 0; color: var(--text); }
      </style>
      <div id="s08-optimise" data-composition-id="s08-optimise" data-width="1920" data-height="1080">
        <div class="stage"><div class="shot"></div>
          <div class="vwrap" id="s08-vw02"><video id="s08-rec02" data-rec="rec-02-optimise" data-hf-media-start-basis="local" src="captures/rec/rec-02-optimise.mp4" muted playsinline data-start="0.0" data-duration="6.842" data-media-start="0.404" data-track-index="3"></video></div></div>
      </div>
      <script>
        (function () {
          const ID = 's08-optimise', FX = window.FX, CAP = window.CAP
          const root = document.getElementById(ID), stage = root.querySelector('.stage'), L = FX.clock(ID)
          const W = (l, w, n) => L(FX.word(l, w, n || 0))
          const tl = gsap.timeline({ paused: true })
          FX.envelope(tl, stage, ID)
          const { cam, frame } = FX.browser(root.querySelector('.shot'), 'localhost · FIN-04 · Resilience optimiser', '● Live app')
          FX.h('img', { src: CAP.stills['optimiser'].file }, frame)
          const R = FX.rec('rec-02-optimise')
          const vw = root.querySelector('#s08-vw02')
          frame.appendChild(vw)   // static video tag moved into the browser frame
          FX.demoChrome(stage, tl)
          FX.camSet(tl, cam, FX.camRest, 0)
          const tEnd = L(R.end)
          tl.to(vw, { opacity: 0, duration: 0.25 }, tEnd - 0.25)

          const RO = (k) => FX.rect('optimiser', k)
          const kB = RO('kBefore'), kA = RO('kAfter'), kC = RO('kCost'), kG = RO('kGap'), plan = RO('plan')
          const camK = FX.camFocus({ x: kB.x, y: kB.y, w: kG.x + kG.w - kB.x, h: plan.y + plan.h - kB.y }, { pad: 60, max: 1.3, dy: -40 })
          FX.camTo(tl, cam, camK, tEnd - 0.15, 1.0)

          // five interventions within budget
          const hlPlan = FX.hl(frame, plan, { pad: 4 }), hlC = FX.hl(frame, kC, { pad: 3 })
          const tFive = W('L31', 'five') - 0.25
          tl.to([hlPlan, hlC], { opacity: 1, duration: 0.35, stagger: 0.15 }, tFive)
          // the tail cut
          const tCut = L(FX.cue('tail_cut'))
          tl.to([hlPlan, hlC], { opacity: 0, duration: 0.3 }, tCut - 0.35)
          const hlB = FX.hl(frame, kB, { pad: 3 }), hlA = FX.hl(frame, kA, { pad: 3 })
          tl.to([hlB, hlA], { opacity: 1, duration: 0.3, stagger: 0.12 }, tCut - 0.1)
          const sA = FX.screenRect(camK, kA)
          const cBA = FX.callout(stage, { k: 'Mean impact of the 10 worst events', s: 'Plan: $2.46M a year of a $3M budget (placeholder costs). Best plan under stated assumptions — not a recommendation.', cls: 'gd' }, sA.x - 140, sA.y + sA.h + 110, 680)
          const ba = FX.h('div', { class: 'ba' }, cBA, '<div class="row"><b>Before</b><div class="bar"><div class="fill f1"></div></div><span>3.25%</span></div><div class="row"><b>After</b><div class="bar"><div class="fill f2"></div></div><span>3.09%</span></div>')
          cBA.insertBefore(ba, cBA.querySelector('.s'))
          tl.fromTo(cBA, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, tCut + 0.1)
          tl.fromTo(ba.querySelector('.f1'), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'power3.out' }, tCut + 0.3)
          tl.fromTo(ba.querySelector('.f2'), { scaleX: 0 }, { scaleX: 3.09 / 3.25, duration: 0.8, ease: 'power3.out' }, tCut + 0.55)
          const pct = FX.h('div', { class: 'v', style: { fontSize: '58px', marginTop: '8px' } }, null, '−5.0%')
          cBA.insertBefore(pct, ba)
          tl.fromTo(pct, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4 }, W('L31', '5%') - 0.25)

          // brute force: nothing better
          const tBr = W('L32', 'brute') - 0.2
          tl.to([hlB, hlA, cBA], { opacity: 0, duration: 0.3 }, tBr - 0.3)
          const hlG = FX.hl(frame, kG, { pad: 3 })
          tl.to(hlG, { opacity: 1, boxShadow: '0 0 0 9999px rgba(12,16,22,0.42)', duration: 0.4 }, tBr)
          const sG = FX.screenRect(camK, kG)
          const cG = FX.callout(stage, { k: 'Checked against brute force', v: '0.0% gap', s: 'Exhaustive search over 197 feasible plans finds nothing better. The reduction stays positive in 50 of 50 uncertainty draws.', cls: 'gd' }, sG.x + sG.w - 640, sG.y + sG.h + 40, 640)
          tl.fromTo(cG, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, W('L32', '197') - 0.2)

          window.__timelines[ID] = tl
        })()
      </script>
    </template>
  </body>
</html>
